databases:
  - name: mini-payroll-db
    plan: free

services:
  - type: web
    name: mini-payroll-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/employees
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-payroll-db
          property: connectionString
      - key: SPRING_JPA_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
